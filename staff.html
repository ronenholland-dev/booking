<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>יומן תורים — צוות המרפאה</title>
<link rel="manifest" href="data:application/json,%7B%22name%22%3A%22%D7%99%D7%95%D7%9E%D7%9F%20%D7%AA%D7%95%D7%A8%D7%99%D7%9D%22%2C%22display%22%3A%22standalone%22%7D">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">

<!--
═══════════════════════════════════════════════════════════════════════
  מרפאת ד"ר רונן הולנד — מסך פנימי לצוות
  שלב 3

  קובץ נפרד מ-booking.html במכוון: הוא דורש הזדהות, והאפליקציה של
  המטופל לא צריכה לשאת את הקוד הזה.

  ⚠️ הקובץ הזה מציג שמות, ניידים וסוגי טיפול. הוא לא אמור להיות
     מקושר מהאתר, ו-robots.txt לא מספיק — ההגנה האמיתית היא
     Firebase Auth יחד עם firestore.rules.

  זרימת הצבעים (לפי האיפיון):
     כתום  = נקלט, בטיפול
     אדום  = עברו שעתיים מאז ההודעה הראשונה בלי תגובה
     ירוק  = שולם והועתק לאודורו
     אפור  = בוטל (הסלוט השתחרר, ניתן להחיות)
═══════════════════════════════════════════════════════════════════════
-->

<style>
:root{
  --navy:#2b3a5c; --navy-dark:#22304c;
  --sage:#7ba39b; --sage-hover:#6d938b;
  --mint:#dff0ec;
  --orange:#e8a33d; --orange-bg:#fdf3e3;
  --green:#4d9d6d;  --green-bg:#e8f5ed;
  --red:#c85a4e;    --red-bg:#fbeae8;
  --grey:#9aa0a8;   --grey-bg:#f2f3f5;
  --line:#e4e4e4; --text:#2f3542; --muted:#6f7683;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Heebo',-apple-system,'Segoe UI',Arial,sans-serif;
  color:var(--text);background:#f7f8f9;font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;min-height:100vh;background:#fff}

/* ── כניסה ── */
#login{padding:60px 24px;max-width:400px;margin:0 auto}
#login h1{font-size:22px;color:var(--navy);text-align:center;margin:0 0 6px}
#login .sub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:32px}
#login input{width:100%;font-family:inherit;font-size:17px;padding:15px 14px;
  border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px}
#login button{width:100%;background:var(--navy);color:#fff;border:none;
  border-radius:var(--radius);padding:17px;font:700 17px inherit;cursor:pointer}
#loginErr{color:var(--red);font-size:15px;margin-top:14px;text-align:center;min-height:22px}

/* ── כותרת ── */
.top{background:var(--navy);color:#fff;padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:18px;font-weight:700}
.top .who{font-size:13px;opacity:.8}
.top button{background:transparent;border:1px solid rgba(255,255,255,.45);
  color:#fff;border-radius:8px;padding:7px 12px;font:500 14px inherit;cursor:pointer}

/* ── לשוניות ── */
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fff;
  position:sticky;top:56px;z-index:19}
.tab{flex:1;padding:15px 6px;text-align:center;background:none;border:none;
  font:500 15px inherit;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--navy);font-weight:700;border-bottom-color:var(--sage)}
.tab .n{display:inline-block;min-width:21px;padding:0 6px;margin-inline-start:5px;
  background:var(--grey-bg);border-radius:11px;font-size:13px;color:var(--muted)}
.tab.on .n{background:var(--sage);color:#fff}

/* ── סרגל ── */
.bar{padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid var(--line)}
.bar input[type=search]{flex:1;min-width:170px;font-family:inherit;font-size:16px;
  padding:11px 13px;border:1px solid var(--line);border-radius:8px}
.btn-add{background:var(--sage);color:#fff;border:none;border-radius:8px;
  padding:11px 16px;font:700 15px inherit;cursor:pointer;white-space:nowrap}
.btn-add:hover{background:var(--sage-hover)}
.daynav{display:flex;align-items:center;gap:8px}
.daynav button{background:#fff;border:1px solid var(--line);border-radius:8px;
  width:38px;height:38px;font-size:17px;color:var(--navy);cursor:pointer;font-family:inherit}
.daynav .lbl{font-weight:700;color:var(--navy);min-width:130px;text-align:center;font-size:15px}

/* ── כרטיס תור ── */
.list{padding:16px 20px 40px}
.card{border-radius:var(--radius);border:1px solid var(--line);
  border-inline-start:5px solid var(--orange);background:var(--orange-bg);
  padding:15px 16px;margin-bottom:13px}
.card.green{border-inline-start-color:var(--green);background:var(--green-bg)}
.card.red{border-inline-start-color:var(--red);background:var(--red-bg)}
.card.grey{border-inline-start-color:var(--grey);background:var(--grey-bg);opacity:.82}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .when{font-weight:700;font-size:17px;color:var(--navy)}
.card .name{font-weight:700;font-size:17px}
.card .meta{color:var(--muted);font-size:14px;margin-top:3px}
.card .topic{margin-top:7px;font-size:15px}

/* ── פרטי המטופל: שורות מיושרות לימין, אחת מתחת לשנייה ── */
.fields{margin-top:9px;text-align:right}
.fields .row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:4px}
.fields .f{display:flex;align-items:baseline;gap:6px;min-width:0}
.fields .k{color:var(--muted);font-size:14px;white-space:nowrap}
.fields .v{font-weight:700;font-size:16px;cursor:pointer;border-bottom:1px dashed transparent;
  padding:1px 2px;border-radius:4px;transition:background .12s}
.fields .v:hover{background:rgba(43,58,92,.09);border-bottom-color:var(--muted)}
.fields .v.copied{background:var(--green-bg);border-bottom-color:var(--green)}
.fields .v.none{font-weight:400;color:var(--muted);cursor:default}
.fields .v.none:hover{background:none;border-bottom-color:transparent}

/* ── מצב העתקה לאודורו ── */
.copybar{margin-top:10px;padding:11px 13px;border-radius:8px;background:#fff;
  border:1px solid var(--navy);display:none}
.copybar.on{display:block}
.copybar .step{font-size:14px;color:var(--muted);margin-bottom:8px}
.copybar .next{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.copybar .nextval{font-weight:700;font-size:17px;color:var(--navy)}
.copybar button{background:var(--navy);color:#fff;border:none;border-radius:8px;
  padding:10px 16px;font:700 15px inherit;cursor:pointer}
.copybar button.ghost{background:#fff;color:var(--muted);border:1px solid var(--line);font-weight:500}
.copybar .done{color:var(--green);font-weight:700;font-size:15px}
.copybar .track{display:flex;gap:5px;margin-top:9px}
.copybar .track i{flex:1;height:4px;border-radius:2px;background:var(--line);font-style:normal}
.copybar .track i.ok{background:var(--green)}
.copybar .track i.cur{background:var(--navy)}
.card .note{margin-top:8px;padding:9px 11px;background:rgba(255,255,255,.75);
  border-radius:7px;font-size:14px;color:var(--text)}
.card a.tel{color:var(--navy);font-weight:500;text-decoration:none;border-bottom:1px dashed}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:12.5px;padding:3px 9px;border-radius:20px;background:#fff;
  border:1px solid var(--line);color:var(--muted)}
.badge.ret{background:var(--mint);border-color:var(--sage);color:var(--navy);font-weight:700}
.badge.manual{background:#eef1f6;border-color:#c7d0e0;color:var(--navy)}
.badge.late{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}

.checks{margin-top:12px;padding-top:11px;border-top:1px solid rgba(0,0,0,.08)}
.chk{display:flex;align-items:flex-start;gap:9px;padding:6px 0;cursor:pointer;font-size:15px}
.chk input{width:19px;height:19px;margin:2px 0 0;flex:none;accent-color:var(--sage);cursor:pointer}
.chk .stamp{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.chk.danger{color:var(--red)}
/* אירוע שכבר קרה — תיעוד, לא תיבה שאפשר לכבות בטעות */
.done{display:flex;align-items:flex-start;gap:9px;padding:6px 0;font-size:15px}
.done .tick{flex:none;width:19px;margin-top:1px;color:#1c7d45;font-size:16px;line-height:1.2}
.done .txt{flex:1}
.done .stamp{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.done .undo{flex:none;background:none;border:none;padding:2px 4px;cursor:pointer;
  color:var(--muted);font:400 12.5px inherit;text-decoration:underline;opacity:.65}
.done .undo:hover{opacity:1;color:var(--red)}
/* תזכורת העלאת ההמרות — בולטת מספיק כדי לא להתפספס, שקטה מספיק
   כדי לא להיראות כמו שגיאה. */
.adsbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  margin:0 0 14px;padding:12px 15px;border-radius:10px;
  background:#fff8e8;border:1px solid #e8d5a3}
.adsbar.hidden{display:none}
.adsbar .txt{flex:1;min-width:190px;font-size:14.5px;line-height:1.5}
.adsbar .txt b{display:block;font-size:15px;margin-bottom:2px}
.adsbar .txt span{color:var(--muted)}
.adsbar button{background:var(--navy);color:#fff;border:1px solid var(--navy);
  border-radius:8px;padding:9px 15px;font:600 14px inherit;cursor:pointer}
.adsbar button.ghost{background:#fff;color:var(--muted);border-color:#ddd;font-weight:400}
.acts{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap}
.acts button{background:#fff;border:1px solid var(--navy);color:var(--navy);
  border-radius:8px;padding:9px 14px;font:500 14px inherit;cursor:pointer}
.acts button:hover{background:#f4f7fb}
.acts button.primary{background:var(--navy);color:#fff}
.acts .wabtn{display:inline-block;text-decoration:none;background:#fff;
  border:1px solid #25a35a;color:#1c7d45;border-radius:8px;
  padding:9px 14px;font:500 14px inherit;cursor:pointer}
.acts .wabtn:hover{background:#eefaf2}
.acts .wabtn.go{background:#25a35a;color:#fff;font-weight:700}
.acts .wabtn.go:hover{background:#1f8d4d}

.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:16px}

/* ── לוח שנה חודשי בלשונית היומן ── */
.mcal{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:20px}
.mcal .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mcal .nav button{background:#fff;border:1px solid var(--line);border-radius:8px;
  width:36px;height:36px;font-size:17px;color:var(--navy);cursor:pointer;font-family:inherit}
.mcal .nav .mon{font-weight:700;color:var(--navy);font-size:16px}
.mcal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mcal .dw{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.mcal .d{aspect-ratio:1;border:none;border-radius:8px;background:#fff;color:var(--text);
  font-family:inherit;font-size:14px;cursor:pointer;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.mcal .d:hover{background:var(--grey-bg)}
.mcal .d.closed{background:#fafafa;color:#c9cdd3}
.mcal .d.ovr{box-shadow:inset 0 -3px 0 var(--orange)}
.mcal .d.today{outline:2px solid var(--sage);outline-offset:-2px;font-weight:700}
.mcal .d.sel{background:var(--navy);color:#fff;font-weight:700}
.mcal .d.blank{background:transparent;cursor:default}
.mcal .d .dots{display:flex;gap:2px;height:5px}
.mcal .d .dots i{width:5px;height:5px;border-radius:50%;font-style:normal}
.mcal .d .dots i.orange{background:var(--orange)}
.mcal .d .dots i.red{background:var(--red)}
.mcal .d .dots i.green{background:var(--green)}
.mcal .d.sel .dots i{box-shadow:0 0 0 1px #fff}

/* ── ציר היום ── */
.dayhdr{font-weight:700;color:var(--navy);font-size:17px;margin:0 0 12px}
.free{border:1px dashed var(--line);border-radius:var(--radius);padding:12px 15px;
  margin-bottom:13px;display:flex;justify-content:space-between;align-items:center;
  gap:10px;flex-wrap:wrap;background:#fcfdfd}
.free .t{font-weight:700;color:var(--sage);font-size:16px}
.free .lbl{color:var(--muted);font-size:14px}
.free button{background:#fff;border:1px solid var(--sage);color:var(--sage);
  border-radius:8px;padding:8px 14px;font:700 14px inherit;cursor:pointer}
.free button:hover{background:var(--mint)}
/* זמן חסום — נראה אחרת מ"פנוי" ומ"תפוס", ובלי כפתור קביעה */
.blockedrow{border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 15px;margin-bottom:13px;display:flex;align-items:center;
  gap:12px;flex-wrap:wrap;
  background:repeating-linear-gradient(135deg,#f4f5f7,#f4f5f7 9px,#eceef1 9px,#eceef1 18px)}
.blockedrow .t{font-weight:700;color:var(--muted);font-size:16px}
.blockedrow .lbl{color:#5b6270;font-size:14.5px;font-weight:600}
/* אירוע קבוע — נראה כמו פגישה, לא כמו תור מטופל */
.evrow{border:1px solid #b9c4d8;border-inline-start:5px solid #5b74a8;
  border-radius:var(--radius);padding:13px 15px;margin-bottom:13px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#f5f7fc}
.evrow .t{font-weight:700;color:#3f5288;font-size:16px}
.evrow .ttl{flex:1;font-weight:600;color:#2f3542;font-size:15px}
.evrow button{background:#fff;border:1px solid #b9c4d8;color:#5b6270;
  border-radius:8px;padding:7px 12px;font:500 13.5px inherit;cursor:pointer}
.evrow button:hover{background:#eef1f8}
/* אירוע שבוטל לשבוע זה — בראש היום, בלי שעה */
.evcancelled{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:13px;padding:10px 14px;border-radius:var(--radius);
  background:#f7f7f8;border:1px dashed #cfd3d9}
.evcancelled .x{color:#b23b3b;font-weight:700}
.evcancelled .ttl{flex:1;color:var(--muted);font-size:14.5px;text-decoration:line-through}
.evcancelled button{background:#fff;border:1px solid #cfd3d9;color:var(--navy);
  border-radius:8px;padding:6px 12px;font:600 13px inherit;cursor:pointer}
/* משימות היום — בראש הלוז, לפני ציר הזמן */
.rxhdr{font-weight:700;color:var(--navy);font-size:14.5px;margin:4px 0 10px;
  padding-bottom:6px;border-bottom:2px solid var(--mint)}
.card.rx .hd .when{color:#7a5ea8}
.rxchk{margin:14px 0 4px;font-weight:600}
.rxinfo{background:#f3f0fa;border:1px solid #d9d0ee;border-radius:9px;
  padding:11px 13px;margin-bottom:12px;font-size:14px;line-height:1.6;color:#4a3c6b}
.closedday{text-align:center;color:var(--muted);background:var(--grey-bg);
  border-radius:var(--radius);padding:16px;font-size:15px;margin-bottom:16px}

/* ── מסך ההגדרות ── */
.setnote{background:var(--mint);border-radius:8px;padding:11px 14px;
  font-size:14px;color:var(--navy);margin-bottom:16px}
.dayedit{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:24px}
.dayedit h3{margin:0 0 10px;font-size:17px;color:var(--navy)}
.dayedit .state{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:13px;padding:4px 11px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
.tag.def{background:#fff}
.tag.closed{background:var(--grey-bg);color:var(--text)}
.tag.custom{background:var(--mint);border-color:var(--sage);color:var(--navy);font-weight:700}
.tag.part{background:var(--orange-bg);border-color:var(--orange);color:#8a5f14}
.dayacts{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.dayacts button{background:#fff;border:1px solid var(--navy);color:var(--navy);
  border-radius:8px;padding:9px 14px;font:500 14px inherit;cursor:pointer}
.dayacts button:hover{background:#f4f7fb}
.hint{font-size:13.5px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.unit{border:1px solid var(--line);background:#fff;border-radius:7px;
  padding:9px 2px;font:500 14px inherit;cursor:pointer;color:var(--text)}
.unit.on:hover{background:var(--mint);border-color:var(--sage)}
.unit.off{background:var(--grey-bg);color:#b0b5bb;text-decoration:line-through;border-style:dashed}
.unit.taken{background:var(--orange-bg);border-color:var(--orange);color:#8a5f14;cursor:not-allowed}

.weekly{border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.weekly h3{margin:0 0 6px;font-size:17px;color:var(--navy)}
.weekly table{width:100%;border-collapse:collapse;margin-bottom:14px}
.weekly th{text-align:right;font-size:13px;color:var(--muted);font-weight:500;padding:6px 4px}
.weekly td{padding:5px 4px;font-size:15px}
.weekly td:first-child{font-weight:700;color:var(--navy);white-space:nowrap}
.weekly input[type=time]{font-family:inherit;font-size:15px;padding:7px 9px;
  border:1px solid var(--line);border-radius:7px;width:100%;background:#fff}
.wkoff{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.wkoff input{width:17px;height:17px;accent-color:var(--sage)}
.weekly button{background:var(--navy);color:#fff;border:none;border-radius:8px;
  padding:12px 20px;font:700 15px inherit;cursor:pointer}
.day-head{font-weight:700;color:var(--navy);margin:22px 0 11px;font-size:16px}
.day-head:first-child{margin-top:0}

/* ── חלון ── */
.modal{position:fixed;inset:0;background:rgba(20,25,35,.55);z-index:40;
  display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;
  padding:22px 20px 30px;max-height:92vh;overflow:auto}
@media(min-width:560px){.modal{align-items:center}.modal .sheet{border-radius:16px}}
.sheet h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.sheet label{display:block;font-weight:700;font-size:15px;color:var(--navy);margin:0 0 5px}
.sheet input,.sheet select,.sheet textarea{width:100%;font-family:inherit;font-size:16px;
  padding:12px 13px;border:1px solid var(--line);border-radius:8px;margin-bottom:15px;background:#fff}
.sheet textarea{min-height:70px;resize:vertical}
.sheet .row{display:flex;gap:10px}
.sheet .row>*{flex:1}
.sheet .err{color:var(--red);font-size:14px;margin:-9px 0 13px;display:none}
.sheet .err.on{display:block}
.slotpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin-bottom:16px}
.slotpick button{border:1px solid var(--line);background:#fff;border-radius:8px;
  padding:11px 4px;font:500 15px inherit;cursor:pointer;color:var(--text)}
.slotpick button.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700}
.sheet .go{width:100%;background:var(--sage);color:#fff;border:none;border-radius:var(--radius);
  padding:16px;font:700 17px inherit;cursor:pointer}
.sheet .cancel{width:100%;background:none;border:none;color:var(--muted);
  padding:14px;font:500 15px inherit;cursor:pointer;margin-top:4px}

#toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);
  background:var(--navy);color:#fff;padding:13px 22px;border-radius:26px;

];

const reasonByCode = (c) => CANCEL_REASONS.find(r => r.code === c) || null;

/* תורים שבוטלו לפני שהיו קודי סיבה — נופלים לנוסח הישן, שהיה
   הנוסח היחיד שקיים אז ממילא. */
function cancelWaKind(a) {
  const r = reasonByCode(a && a.cancel_code);
  return (r && r.wa) || 'cancel';
}

const DOW = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const pad = (n) => String(n).padStart(2,'0');
const isoOf   = (d) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hhmmOf  = (d) => pad(d.getHours())+':'+pad(d.getMinutes());
const unitKey = (d) => pad(d.getHours())+pad(d.getMinutes());
const toMin   = (s) => { const [h,m]=s.split(':').map(Number); return h*60+m; };

const dateOf = (a) => a.slot_start && a.slot_start.toDate ? a.slot_start.toDate()
                                                          : new Date(a.slot_start);
const stampOf = (v) => !v ? null : (v.toDate ? v.toDate() : new Date(v));

/* ── משימת חידוש מרשם ──────────────────────────────────────────────
   מטופל מבקש חידוש מרשם בוואטסאפ. זו משימה ולא תור: היא צורכת זמן
   מיום העבודה, אבל אין מולה מטופל בשעה מסוימת.

   ולכן, בשלושה דברים היא שונה מתור:
     · אינה תופסת שום יחידת זמן ביומן — unitsOf מחזיר ריק
     · אינה נגזרת לאודורו — אין מה לוודא מול המטופל, ואין תור פיזי
       שצריך להופיע ב-Q-Flow של המרפאה
     · מוצגת בראש היום בלי שעה, ולא במיקום בציר הזמן
   ─────────────────────────────────────────────────────────────── */
const isRxTask = (a) => !!(a && a.rx_task);

function unitsOf(appt) {
  if (isRxTask(appt)) return [];   // משימה אינה תופסת סלוט
  const d = dateOf(appt), out = [];
  const start = d.getHours()*60 + d.getMinutes();
  for (let m = start; m < start + (appt.slot_duration_min||30); m += CFG.baseGridMin) {
    out.push(pad(Math.floor(m/60)) + pad(m%60));
  }
  return out;
}

/* יום העבודה הבא שהמרפאה פתוחה בו, החל ממחר.
   משימה שנופלת על שבת או חג פשוט לא תיראה עד שהיום יגיע. */
function nextWorkingDay(from) {
  const d = new Date(from || new Date());
  d.setHours(0,0,0,0);
  for (let i = 0; i < 60; i++) {
    d.setDate(d.getDate() + 1);
    if (windowFor(d)) return d;
  }
  return d;   // גיבוי — לא אמור לקרות
}

/* ── מצב הסלוט: הכלל מהאיפיון, מחושב בזמן תצוגה ולא בתהליך רקע ── */
function statusOf(a) {
  if (a.status === 'cancelled') return 'grey';
  const f = a.flags || {};
  // משימת מרשם: ירוקה כשבוצעה. אין כאן שעתיים ואין אודורו.
  if (isRxTask(a)) return f.rx_done_at ? 'green' : 'orange';
  if (a.source === 'manual') return f.copied_at ? 'green' : 'orange';
  if (f.paid_entered_at) return 'green';
  if (f.contacted_at) {
    const t = stampOf(f.contacted_at);
    if (t && Date.now() - t.getTime() > CFG.lateHours*3600e3) return 'red';
  }
  return 'orange';
}

/* תאריך ושעה מלאים: 08/09/26 · 14:35.
   שנה דו-ספרתית ושעון 24 — קצר מספיק לשורה בכרטיס, ומדויק מספיק
   כדי לשחזר מה קרה מתי בלי לנחש. */
const fmtStamp = (v) => {
  const d = stampOf(v); if (!d) return '';
  return pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' +
         pad(d.getFullYear() % 100) + ' · ' + hhmmOf(d);
};

  }
};

/* קישור לקביעת תור — להדבקה בווטסאפ למי שעוד אין לו תור.
   נבנה מ-CFG כדי שהפרמטר src לא ייכתב ידנית ולא יישמט. */
$('copyBook').onclick = async () => {

let unsub = null;
onAuthStateChanged(auth, (user) => {

/* ── ?mark=<id> — הגעה מהמייל ─────────────────────────────────────
   הכפתור "סמן שנשלחה" במייל פותח את המסך עם הפרמטר הזה. הסימון
   נעשה כאן ולא במייל, כי רק כאן יש הזדהות — ורק משתמש מזוהה
   רשאי לשנות תור. ראו firestore.rules.
   ─────────────────────────────────────────────────────────────── */
let pendingMark = null;
function handleMarkParam() {
  const id = new URLSearchParams(location.search).get('mark');
  if (!id) return;
  pendingMark = id;
  history.replaceState(null, '', location.pathname);   // שלא יסומן שוב ברענון
}
function applyPendingMark() {
  if (!pendingMark) return;
  const a = appts.find(x => x._id === pendingMark);
  if (!a) return;                       // עוד לא נטען — ננסה בעדכון הבא
  const id = pendingMark; pendingMark = null;
  if (a.flags && a.flags.contacted_at) {
    toast('התור כבר מסומן כטופל');
  } else {
    setFlag(id, 'contacted_at', true);
    toast('סומן שנשלחה הודעה ראשונה');
  }
  state.tab = 'todo'; state.search = '';
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === 'todo'));
  render();
  setTimeout(() => {
    const el = document.querySelector('[data-card="'+id+'"]');
    if (!el) return;
    // הדגשה וגלילה הן נוחות בלבד — לא נותנים להן להפיל את הסימון
    try { el.scrollIntoView({ block:'center', behavior:'smooth' }); } catch (e) {}
    el.style.outline = '3px solid var(--navy)';
    el.style.outlineOffset = '2px';
    setTimeout(() => { el.style.outline = ''; }, 4000);
  }, 100);
}

/* ══════════════════════════════════════════════════════════════════
   4. נתונים בזמן אמת
   כל שינוי — תור חדש, סימון צ'קבוקס, ביטול — מופיע מיד בכל מכשיר
   שפתוח בו המסך, בלי רענון.
   ══════════════════════════════════════════════════════════════════ */
let appts = [];
const state = { tab: 'todo', day: new Date(), search: '', calMonth: null };
state.day.setHours(0,0,0,0);

/* ── למה אין כאן where על התאריך ─────────────────────────────────────
   ב-Firestore, פילטר טווח מול Timestamp לא מתאים למסמכים שבהם השדה
   נשמר כמחרוזת. תקלה אמיתית שקרתה: booking.html כתב מחרוזת ISO,
   staff.html חיפש Timestamp, והתור פשוט לא הופיע — למרות שהיה במסד.

   שני הקבצים כותבים היום Timestamp, אבל הסתמכות על התאמת טיפוסים בין
   שני קבצים נפרדים היא שבירה מדי. לכן: מושכים את המסמכים האחרונים
   וּמסננים בדפדפן, שם dateOf() יודע לקרוא גם מחרוזת וגם Timestamp.
   בנפח של המרפאה (מאות תורים בשנה) זה זול לגמרי, וחסין לתקלה הזו.
   ─────────────────────────────────────────────────────────────────── */
function subscribe() {
  const q = query(collection(db,'appointments'), orderBy('slot_start','desc'), limit(400));
  unsub = onSnapshot(q,
    (snap) => {
      const from = new Date();
      from.setDate(from.getDate() - CFG.historyDays);
      from.setHours(0,0,0,0);
      appts = snap.docs
        .map(d => Object.assign({ _id:d.id }, d.data()))
        .filter(a => { const t = dateOf(a); return t instanceof Date && !isNaN(t) && t >= from; })
        .sort((x,y) => dateOf(x) - dateOf(y));
      render();
      applyPendingMark();
    },
    (err) => {
      console.error(err);
      const perm = String(err && err.code || '').includes('permission');
      $('list').innerHTML = '<div class="empty">' +
        (perm ? 'אין הרשאה לקרוא את התורים.<br>יש לוודא שהמייל שאיתו נכנסתם מופיע ברשימת הצוות ב-firestore.rules.'
              : 'שגיאת חיבור למסד הנתונים.<br>' + esc(String(err && err.message || err))) +
        '</div>';
    });
}

/* הסלוט האדום נקבע לפי שעתיים מהסימון. מסך שנשאר פתוח צריך
   להאדים מעצמו, ולכן ריענון תצוגה קל כל דקה. אין כאן קריאה לשרת. */
setInterval(() => { if (appts.length) render(); }, 60000);

/* ══════════════════════════════════════════════════════════════════
   5. כתיבה — תמיד בטרנזקציה
   שני אנשים על אותו כרטיס באותו רגע לא יכולים לדרוס זה את זה.
   ══════════════════════════════════════════════════════════════════ */
async function setFlag(id, field, on) {
  const ref = doc(db,'appointments',id);
  try {
    await runTransaction(db, async (tx) => {
      const s = await tx.get(ref);
      if (!s.exists()) throw new Error('missing');
      const a = s.data();
      const flags = Object.assign({}, a.flags || {});
      flags[field] = on ? Timestamp.now() : null;

      const patch = { flags, status_changed_at: Timestamp.now() };
      // הסטטוס נגזר מהצ'קבוקסים — לא נשמר בנפרד ולא יכול לסתור אותם
      if (field === 'paid_entered_at' || field === 'copied_at') {
        patch.status = on ? 'entered_to_odoro' : 'pending';
      }
      tx.update(ref, patch);
    });
  } catch (e) { console.error(e); toast('השמירה נכשלה'); }
}

/* ── ביטול תור ─────────────────────────────────────────────────────
   שני שלבים: בוחרים סיבה, ורק אז מבטלים. הסיבה אינה קישוט —
   היא נשמרת על התור, מופיעה ברשימת המבוטלים, וקובעת איזה נוסח
   ווטסאפ ייפתח. בלעדיה כל ביטול נראה כמו "המטופל לא הגיב", גם
   כשהמרפאה היא שביטלה. ──────────────────────────────────────── */
function cancelAppt(a) {
  const host = $('modalHost');
  const n = splitName(a);

  host.innerHTML =
  '<div class="modal"><div class="sheet">' +
    '<h2>ביטול תור</h2>' +
    '<div class="sub">' + esc([n.first, n.last].filter(Boolean).join(' ')) +
      ' · ' + esc(hhmmOf(dateOf(a))) + '</div>' +
    '<label>סיבת הביטול</label>' +
    '<select id="cReason">' +
      CANCEL_REASONS.map(r => '<option value="'+r.code+'">'+esc(r.label)+'</option>').join('') +
    '</select>' +
    '<div id="cFreeWrap" style="display:none">' +
      '<label>פירוט</label><input id="cFree" placeholder="מה הסיבה?">' +
      '<div class="err" id="eFree">נא לפרט את הסיבה</div>' +
    '</div>' +
    '<div class="note" style="margin-top:14px">' + esc(TXT.cancelWarn.split('\n\n')[1] || '') + '</div>' +
    '<button class="go" id="cGo">ביטול התור</button>' +
    '<button class="cancel" id="cBack">חזרה</button>' +
  '</div></div>';

  const close = () => { host.innerHTML = ''; };
  $('cBack').onclick = close;
  host.querySelector('.modal').onclick = (e) => { if (e.target.classList.contains('modal')) close(); };

  const sel = $('cReason');
  sel.onchange = () => {
    $('cFreeWrap').style.display = sel.value === 'other' ? '' : 'none';
  };

  $('cGo').onclick = async () => {
    const code = sel.value;
    const free = $('cFree') ? $('cFree').value.trim() : '';
    if (code === 'other' && free.length < 2) { $('eFree').classList.add('on'); return; }
    const label = code === 'other' ? free : reasonByCode(code).label;

    const btn = $('cGo'); btn.disabled = true; btn.textContent = 'מבטל…';
    const ok = await doCancel(a, code, label);
    btn.disabled = false; btn.textContent = 'ביטול התור';
    if (ok) close();
  };
}

/* משחרר את הסלוט ומעביר לרשימת המבוטלים — שני מסמכים,
   טרנזקציה אחת, כדי שלא ייווצר מצב ביניים. */
async function doCancel(a, code, label) {
  const dIso = isoOf(dateOf(a)), units = unitsOf(a);
  try {
    await runTransaction(db, async (tx) => {
      const dayRef = doc(db,'day_slots',dIso);
      const dSnap  = await tx.get(dayRef);
      if (dSnap.exists()) {
        const u = Object.assign({}, dSnap.data().units || {});
        units.forEach(k => { if (u[k] && u[k].a === a._id) delete u[k]; });
        tx.update(dayRef, { units: u });
      }
      tx.update(doc(db,'appointments',a._id), {
        status: 'cancelled',
        status_changed_at: Timestamp.now(),
        cancel_code: code,
        cancel_reason: label
      });
    });
    toast(TXT.cancelled);
    return true;
  } catch (e) { console.error(e); toast('הביטול נכשל'); return false; }
}

async function reviveAppt(a) {
  if (!confirm(TXT.reviveWarn)) return;
  const dIso = isoOf(dateOf(a)), units = unitsOf(a);
  try {
    await runTransaction(db, async (tx) => {
      const dayRef = doc(db,'day_slots',dIso);
      const dSnap  = await tx.get(dayRef);
      const cur = dSnap.exists() ? (dSnap.data().units || {}) : {};
      for (const k of units) {
        const v = cur[k];
        if (v && (!v.e || Date.now() < v.e) && v.a !== a._id) throw new Error('TAKEN');
      }
      const next = Object.assign({}, cur);
      units.forEach(k => { next[k] = { a: a._id, e: null }; });
      tx.set(dayRef, { date: dIso, units: next }, { merge: true });
      tx.update(doc(db,'appointments',a._id), {
        status: 'pending', status_changed_at: Timestamp.now(),
        cancel_reason: null, cancel_code: null
      });
    });
    toast(TXT.revived);
  } catch (e) {
    toast(String(e).includes('TAKEN') ? TXT.noSlot : 'ההחזרה נכשלה');
  }
}

/* ── יצירת משימת חידוש מרשם ────────────────────────────────────────
   בניגוד לתור, אין כאן טרנזקציה על day_slots — המשימה לא תופסת
   סלוט ולכן אין מה לנעול, ואין סיכון להתנגשות. השעה נקבעת ל-00:00
   ומשמשת לקיבוץ לפי יום בלבד; היא לעולם אינה מוצגת.
   ─────────────────────────────────────────────────────────────── */
async function createRxTask(data) {
  const when = new Date(data.when);
  when.setHours(0, 0, 0, 0);
  const id = crypto.randomUUID();

  const appt = {
    id, created_at: Timestamp.now(),
    slot_start: Timestamp.fromDate(when),
    slot_duration_min: 0,
    rx_task: true,
    visit_track: 'follow',
    service_code: 'P',
    patient_first: data.first, patient_last: data.last,
    patient_name: (data.first + ' ' + data.last).trim(),
    patient_phone: data.phone,
    patient_id_number: data.idnum || null,
    patient_note: null,
    staff_note: data.note || null,
    status: 'pending', status_changed_at: null,
    cancel_reason: null, cancel_code: null,
    off_hours: false,
    source: 'manual', created_by: auth.currentUser ? auth.currentUser.email : null,
    flags: {},
    lead_source: 'staff', utm: {}, gclid: null, click_id_type: null,
    referrer: null, device: 'staff',
    first_touch_at: null, reentry_src: null, attribution_recovered: false,
    conversion_sent: false, offline_uploaded: false
  };

  try {
    await setDoc(doc(db, 'appointments', id), appt);
    return { ok: true };
  } catch (e) { console.error(e); return { ok: false }; }
}

/* תור ידני / תור המשך — אותה נעילה אטומית בדיוק כמו בזרימת המטופל.
   זה מה שמונע התנגשות בין תור שהצוות מזין לתור שנקבע במקביל. */
async function createManual(data) {
  const dIso = isoOf(data.when), units = [];
  const start = data.when.getHours()*60 + data.when.getMinutes();
  for (let m = start; m < start + data.duration; m += CFG.baseGridMin)
    units.push(pad(Math.floor(m/60)) + pad(m%60));

  const id = crypto.randomUUID();
  const appt = {
    id, created_at: Timestamp.now(),
    slot_start: Timestamp.fromDate(data.when),
    slot_duration_min: data.duration,
    visit_track: data.duration === 30 ? 'new' : 'follow',
    service_code: data.serviceCode,
    patient_first: data.first, patient_last: data.last,
    patient_name: (data.first + ' ' + data.last).trim(),
    patient_phone: data.phone,
    patient_id_number: data.idnum || null, patient_note: data.note || null,
    status: 'pending', status_changed_at: null, cancel_reason: null, cancel_code: null,
    // תור שנקבע מחוץ לשעות הקבלה — מסומן כדי שיהיה אפשר לראות
    // אחר כך כמה חריגות היו, ולא רק לזכור שהיו
    off_hours: !!data.offHours,
    source: 'manual', created_by: auth.currentUser ? auth.currentUser.email : null,
    flags: {},
    // תור ידני לא הגיע מקמפיין — ולכן לא ייספר כהמרה מגוגל.
    lead_source: 'staff', utm: {}, gclid: null, referrer: null, device: 'staff',
    first_touch_at: null, reentry_src: null, attribution_recovered: false,
    conversion_sent: false, offline_uploaded: false
  };

  try {
    await runTransaction(db, async (tx) => {
      const dayRef = doc(db,'day_slots',dIso);
      const dSnap  = await tx.get(dayRef);
      const cur = dSnap.exists() ? (dSnap.data().units || {}) : {};
      for (const k of units) {
        const v = cur[k];
        if (v && (!v.e || Date.now() < v.e)) throw new Error('TAKEN');
      }
      const next = Object.assign({}, cur);
      units.forEach(k => { next[k] = { a: id, e: null }; });
      tx.set(dayRef, { date: dIso, units: next }, { merge: true });
      tx.set(doc(db,'appointments',id), appt);
    });
    return { ok:true };
  } catch (e) {
    return { ok:false, taken: String(e).includes('TAKEN') };
  }
}

/* ══════════════════════════════════════════════════════════════════
   6. תצוגה
   ══════════════════════════════════════════════════════════════════ */
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  state.tab = b.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  $('daynav').classList.toggle('hidden', state.tab !== 'day');
  document.querySelector('.bar').classList.toggle('hidden', state.tab === 'settings');
  render();
});
$('search').oninput = (e) => { state.search = e.target.value.replace(/\D/g,''); render(); };
const shiftDay = (n) => {
  state.day.setDate(state.day.getDate() + n);
  // הלוח החודשי עוקב אחרי היום הנבחר כשעוברים חודש
  state.calMonth = new Date(state.day.getFullYear(), state.day.getMonth(), 1);
  render();
};
$('dPrev').onclick = () => shiftDay(-1);
$('dNext').onclick = () => shiftDay(1);
$('addBtn').onclick = () => openManual(null);

$('adsExport').onclick = () => adsExport();
/* "לא עכשיו" דוחה ליום אחד בלבד. משימה שנדחית לשבוע נשכחת. */
$('adsLater').onclick = () => {
  lsSet(ADS_SNOOZE_KEY, Date.now() + 86400000);
  $('adsBanner').classList.add('hidden');
  toast('התזכורת תחזור מחר');
};

function visible() {
  let list = appts.slice();
  if (state.search) {
    return list.filter(a => (a.patient_phone||'').includes(state.search));
  }
  if (state.tab === 'cancelled') return list.filter(a => a.status === 'cancelled');
  if (state.tab === 'day') {
    const iso = isoOf(state.day);
    return list.filter(a => a.status !== 'cancelled' && isoOf(dateOf(a)) === iso);
  }
  /* "לטיפול" — כל מה שעדיין לא ירוק ולא מבוטל, הדחוף למעלה.
     משימות מרשם אינן נכנסות לכאן במכוון: הן מופיעות בלוז של היום
     שלהן בלבד, כדי שהרשימה הזו תישאר רשימת מטופלים שממתינים. */
  return list.filter(a => a.status !== 'cancelled' && !isRxTask(a) && statusOf(a) !== 'green')
             .sort((x,y) => {
               const rank = (a) => statusOf(a) === 'red' ? 0 : 1;
               return rank(x) - rank(y) || dateOf(x) - dateOf(y);
             });
}

function render() {
  $('nTodo').textContent = appts.filter(a => a.status !== 'cancelled' && !isRxTask(a) && statusOf(a) !== 'green').length;
  $('nCanc').textContent = appts.filter(a => a.status === 'cancelled').length;
  const d = state.day;
  $('dLbl').textContent = DOW[d.getDay()] + ' ' + d.getDate() + '.' + (d.getMonth()+1);
  paintAdsBanner();

  // לשונית היומן: לוח חודשי + כל היום, פנויים ותפוסים כאחד
  if (state.tab === 'settings') { renderSettings(); return; }
  if (state.tab === 'day' && !state.search) { renderDayView(); return; }

  const list = visible();
  const host = $('list');
  if (!list.length) {
    host.innerHTML = '<div class="empty">' + (
      state.search   ? 'לא נמצא תור עם מספר הנייד הזה' :
      state.tab==='cancelled' ? 'אין תורים מבוטלים' :
      state.tab==='day'       ? 'אין תורים ביום זה' :
                                'אין תורים שממתינים לטיפול ✓') + '</div>';
    return;
  }

  let html = '', lastDay = '';
  const groupByDay = state.tab !== 'day';
  list.forEach(a => {
    if (groupByDay) {
      const dt = dateOf(a), key = isoOf(dt);
      if (key !== lastDay) {
        lastDay = key;
        html += '<div class="day-head">' + DOW[dt.getDay()] + ' ' +
                dt.getDate() + '.' + (dt.getMonth()+1) + '.' + dt.getFullYear() + '</div>';
      }
    }
    html += cardHtml(a);
  });
  host.innerHTML = html;
  wire(host);
}

/* ══════════════════════════════════════════════════════════════════
   6ד. לשונית ההגדרות — שליטה על הלוז
   ─────────────────────────────────────────────────────────────────
   שני מפלסים, בדיוק כפי שהוגדר באיפיון:
     · לוז שבועי קבוע  → calendar_settings/weekly
     · חריג ליום ספציפי → overrides/{YYYY-MM-DD}, דורס את הקבוע

   עקרון־על: שינוי ידני תמיד גובר, גם כשהוא סותר את ברירת המחדל.
   המערכת שואלת פעם אחת ואז מבצעת, בלי לחסום.
   ══════════════════════════════════════════════════════════════════ */
let schedule = { weekly: null, overrides: {} };
let schedLoaded = false;

async function loadSchedule() {
  try {
    const w = await getDoc(doc(db, 'calendar_settings', 'weekly'));
    schedule.weekly = (w.exists() && w.data().hours) ? w.data().hours
                                                     : JSON.parse(JSON.stringify(CFG.hours));
    const snap = await getDocs(collection(db, 'overrides'));
    schedule.overrides = {};
    snap.forEach(d => { schedule.overrides[d.id] = d.data(); });
    schedLoaded = true;
  } catch (e) {
    console.error(e);
    schedule.weekly = JSON.parse(JSON.stringify(CFG.hours));
    toast('טעינת הלוז נכשלה — מוצגת ברירת המחדל');
  }
}

/* חלון הפעילות בפועל ליום — אותה לוגיקה בדיוק כמו באפליקציית המטופל */
function windowFor(date) {
  const ov = schedule.overrides[isoOf(date)];
  if (ov) {
    if (ov.closed) return null;
    if (ov.open && ov.close) return { open: ov.open, close: ov.close };
  }
  return (schedule.weekly || CFG.hours)[date.getDay()] || null;
}
/* ── אירועים קבועים ביומן ──────────────────────────────────────────
   לא כל מה שתופס זמן הוא תור. יש פגישות קבועות — למשל הזום עם ענת
   בימי שלישי — ולהן שעות אמיתיות שצריך לראות, כי היומן הזה הוא
   יומן העבודה בפועל ולא רק רשימת מטופלים.

   מבנה האירוע על מסמך החריג:
     { title, start:'12:00', end:'12:50',
       buffer_before_min:20, buffer_after_min:10, cancelled:false }

   החיץ חוסם קביעת תורים לפני ואחרי, אבל אינו חלק מהאירוע עצמו —
   ולכן אינו מוצג כשעת הפגישה. אירוע מבוטל משחרר את כל היחידות
   שלו, כולל החיץ. ─────────────────────────────────────────────── */
const eventsFor = (date) => {
  const ov = schedule.overrides[isoOf(date)];
  return (ov && Array.isArray(ov.events)) ? ov.events : [];
};

/* היחידות שהאירוע תופס בפועל — כולל החיץ משני הצדדים */
function evUnits(ev) {
  const out = [];
  if (!ev || !ev.start || !ev.end) return out;
  const from = toMin(ev.start) - (ev.buffer_before_min || 0);
  const to   = toMin(ev.end)   + (ev.buffer_after_min  || 0);
  for (let m = Math.max(0, from); m < to; m += CFG.baseGridMin)
    out.push(pad(Math.floor(m/60)) + pad(m%60));
  return out;
}

const blockedFor = (date) => {
  const ov = schedule.overrides[isoOf(date)];
  const set = new Set((ov && ov.blocked) || []);
  eventsFor(date).forEach(ev => { if (!ev.cancelled) evUnits(ev).forEach(u => set.add(u)); });
  return set;
};

async function saveOverride(iso, patch) {
  const cur = schedule.overrides[iso] || { date: iso };
  const next = Object.assign({}, cur, patch, { date: iso });
  /* מסמך שאין בו שום חריגה — נמחק, כדי שהיום יחזור לברירת המחדל.
     ⚠️ אירועים נחשבים תוכן גם כשהם מבוטלים: מסמך שיש בו רק אירוע
        מבוטל חייב לשרוד, אחרת "בטל לשבוע זה" היה מוחק את הפגישה
        הקבועה מאותו תאריך לתמיד ואי אפשר היה להחזיר אותה. */
  const empty = !next.closed && !next.open &&
                !(next.blocked && next.blocked.length) &&
                !(next.events && next.events.length);
  try {
    if (empty) { await deleteDoc(doc(db,'overrides',iso)); delete schedule.overrides[iso]; }
    else       { await setDoc(doc(db,'overrides',iso), next); schedule.overrides[iso] = next; }
    render();
    toast('נשמר');
  } catch (e) { console.error(e); toast('השמירה נכשלה'); }
}

async function saveWeekly(hours) {
  try {
    await setDoc(doc(db,'calendar_settings','weekly'), { hours });
    schedule.weekly = hours;
    render();
    toast('הלוז השבועי נשמר');
  } catch (e) { console.error(e); toast('השמירה נכשלה'); }
}

async function renderSettings() {
  const host = $('list');
  if (!schedLoaded) {
    host.innerHTML = '<div class="empty">טוען את הלוז…</div>';
    await loadSchedule();
  }
  if (!state.calMonth) state.calMonth = new Date(state.day.getFullYear(), state.day.getMonth(), 1);

  host.innerHTML =
    '<div class="setnote">שינוי כאן משפיע מיד על מה שהמטופל רואה באפליקציה.</div>' +
    monthCalHtml(true) +
    '<div id="dayEdit"></div>' +
    weeklyHtml();
  wireMonthCal();
  paintDayEdit();
  wireWeekly();
}

function weeklyHtml() {
  const w = schedule.weekly || CFG.hours;
  const rows = [0,1,2,3,4,5,6].map(i => {
    const h = w[i];
    return '<tr><td>' + DOW[i] + '</td>' +
      '<td><input type="time" data-wk="'+i+'" data-f="open"  value="'+(h?h.open:'')+'"></td>' +
      '<td><input type="time" data-wk="'+i+'" data-f="close" value="'+(h?h.close:'')+'"></td>' +
      '<td><label class="wkoff"><input type="checkbox" data-wkoff="'+i+'"'+(h?'':' checked')+'> סגור</label></td>' +
      '</tr>';
  }).join('');
  return '<div class="weekly">' +
    '<h3>לוז שבועי קבוע</h3>' +
    '<p class="hint">זו ברירת המחדל לכל שבוע. חריג ליום מסוים נקבע בלוח שלמעלה וגובר עליה.</p>' +
    '<table>' +
      '<tr><th>יום</th><th>פתיחה</th><th>סגירה</th><th></th></tr>' + rows +
    '</table>' +
    '<button id="saveWeekly">שמור לוז שבועי</button></div>';
}

function wireWeekly() {
  const btn = $('saveWeekly');
  if (!btn) return;
  btn.onclick = () => {
    const out = {};
    for (let i = 0; i < 7; i++) {
      const off = $('list').querySelector('[data-wkoff="'+i+'"]').checked;
      if (off) { out[i] = null; continue; }
      const o = $('list').querySelector('[data-wk="'+i+'"][data-f="open"]').value;
      const c = $('list').querySelector('[data-wk="'+i+'"][data-f="close"]').value;
      if (!o || !c || o >= c) { toast('שעות לא תקינות ביום ' + DOW[i]); return; }
      out[i] = { open: o, close: c };
    }
    saveWeekly(out);
  };
}

function paintDayEdit() {
  const box = $('dayEdit');
  const d = state.day, iso = isoOf(d);
  const ov = schedule.overrides[iso] || {};
  const defW = (schedule.weekly || CFG.hours)[d.getDay()];
  const w = windowFor(d);
  const label = DOW[d.getDay()] + ' ' + d.getDate() + '.' + (d.getMonth()+1) + '.' + d.getFullYear();

  // יחידות שכבר תפוסות בתור אמיתי — אי אפשר לחסום אותן
  const taken = new Set();
  appts.filter(a => a.status !== 'cancelled' && isoOf(dateOf(a)) === iso)
       .forEach(a => unitsOf(a).forEach(u => taken.add(u)));
  const blocked = blockedFor(d);

  let slots = '';
  if (w) {
    for (let m = toMin(w.open); m < toMin(w.close); m += CFG.baseGridMin) {
      const k = pad(Math.floor(m/60)) + pad(m%60);
      const t = pad(Math.floor(m/60)) + ':' + pad(m%60);
      const cls = taken.has(k) ? 'taken' : (blocked.has(k) ? 'off' : 'on');
      slots += '<button class="unit '+cls+'" data-unit="'+k+'"'+(taken.has(k)?' disabled':'')+
               ' title="'+(taken.has(k)?'תפוס בתור':'לחיצה חוסמת/משחררת')+'">'+t+'</button>';
    }
  }

  box.innerHTML =
    '<div class="dayedit">' +
      '<h3>' + esc(label) + '</h3>' +
      '<div class="state">' +
        (ov.closed ? '<span class="tag closed">סגור ידנית</span>'
         : ov.open ? '<span class="tag custom">שעות חריגות ' + esc(ov.open) + '–' + esc(ov.close) + '</span>'
         : defW    ? '<span class="tag def">לפי הלוז הקבוע ' + esc(defW.open) + '–' + esc(defW.close) + '</span>'
                   : '<span class="tag closed">סגור בלוז הקבוע</span>') +
        (blocked.size ? '<span class="tag part">' +
            (ov.blocked_label ? esc(ov.blocked_label) + ' · ' : '') +
            blocked.size + ' סלוטים חסומים</span>' : '') +
      '</div>' +
      '<div class="dayacts">' +
        (w ? '<button data-set="close">סגור את כל היום</button>' : '') +
        (!w || ov.closed ? '<button data-set="open">פתח את היום</button>' : '') +
        (ov.open || ov.closed || blocked.size
           ? '<button data-set="reset">החזר לברירת המחדל</button>' : '') +
      '</div>' +
      (w ? '<div class="hint">לחיצה על שעה חוסמת אותה למטופלים. שעה תפוסה בתור לא ניתנת לחסימה.</div>' +
           '<div class="units">' + slots + '</div>'
         : '<div class="hint">היום סגור. "פתח את היום" יאפשר לקבוע בו תורים.</div>') +
    '</div>';

  box.querySelectorAll('[data-unit]:not([disabled])').forEach(b => b.onclick = () => {
    const k = b.dataset.unit;
    const cur = new Set(blockedFor(d));
    cur.has(k) ? cur.delete(k) : cur.add(k);
    saveOverride(iso, { blocked: [...cur].sort() });
  });

  box.querySelectorAll('[data-set]').forEach(b => b.onclick = () => {
    const act = b.dataset.set;
    if (act === 'reset') { saveOverride(iso, { closed:false, open:null, close:null, blocked:[] }); return; }
    if (act === 'close') {
      if (taken.size && !confirm('ביום זה כבר יש ' + taken.size/1 + ' יחידות תפוסות בתורים.\n' +
          'סגירת היום לא מבטלת אותם — היא רק מונעת קביעת תורים חדשים.\n\nלהמשיך?')) return;
      saveOverride(iso, { closed:true, open:null, close:null });
      return;
    }
    if (act === 'open') {
      const def = defW || { open:'09:00', close:'14:00' };
      if (!defW && !confirm('היום הזה סגור בלוז הקבוע.\nפתיחה שלו סותרת את ברירת המחדל.\n\nלהמשיך?')) return;
      const o = prompt('שעת פתיחה', def.open); if (!o) return;
      const c = prompt('שעת סגירה', def.close); if (!c) return;
      if (o >= c) { toast('שעת הסגירה חייבת להיות אחרי הפתיחה'); return; }
      saveOverride(iso, { closed:false, open:o, close:c });
    }
  });
}


/* ══════════════════════════════════════════════════════════════════
   6ג. לשונית היומן — לוח חודשי + ציר היום המלא
   מציג את היום כרצף: כל תור תפוס במקומו האמיתי עם פרטי המטופל
   ובצבע לפי אותה חוקיות של "לטיפול", וכל פער פנוי כשורה נפרדת
   שאפשר לקבוע לתוכה ישירות.
   ══════════════════════════════════════════════════════════════════ */
function renderDayView() {
  const host = $('list');
  if (!state.calMonth) {
    state.calMonth = new Date(state.day.getFullYear(), state.day.getMonth(), 1);
  }
  host.innerHTML = monthCalHtml() + '<div id="dayTimeline"></div>';
  wireMonthCal();
  paintTimeline();
}

function monthCalHtml(forSettings) {
  const m = state.calMonth;
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const days  = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);

  // סיכום מצב לכל יום — נקודות צבע קטנות מתחת למספר
  const byDay = {};
  appts.filter(a => a.status !== 'cancelled').forEach(a => {
    const k = isoOf(dateOf(a));
    (byDay[k] = byDay[k] || []).push(statusOf(a));
  });

  let cells = '';
  for (let i = 0; i < first.getDay(); i++) cells += '<div class="d blank"></div>';
  for (let dd = 1; dd <= days; dd++) {
    const date = new Date(m.getFullYear(), m.getMonth(), dd);
    const iso  = isoOf(date);
    const closed = !windowFor(date);
    const ovr    = !!schedule.overrides[iso];
    const sel  = iso === isoOf(state.day);
    const isToday = iso === isoOf(today);
    const sts = byDay[iso] || [];
    const dots = ['red','orange','green']
      .filter(c => sts.includes(c))
      .map(c => '<i class="'+c+'"></i>').join('');
    cells += '<button class="d'+(closed?' closed':'')+(sel?' sel':'')+(isToday?' today':'')+
             (ovr?' ovr':'')+'" data-day="'+iso+'"><span>'+dd+'</span>' +
             '<span class="dots">'+(forSettings?'':dots)+'</span></button>';
  }

  return '<div class="mcal">' +
    '<div class="nav">' +
      '<button data-mon="-1">›</button>' +
      '<span class="mon">'+MONTHS[m.getMonth()]+' '+m.getFullYear()+'</span>' +
      '<button data-mon="1">‹</button>' +
    '</div>' +
    '<div class="grid">' +
      ['א','ב','ג','ד','ה','ו','ש'].map(x=>'<div class="dw">'+x+'</div>').join('') +
      cells +
    '</div></div>';
}

function wireMonthCal() {
  $('list').querySelectorAll('[data-mon]').forEach(b => b.onclick = () => {
    const m = state.calMonth;
    state.calMonth = new Date(m.getFullYear(), m.getMonth() + (+b.dataset.mon), 1);
    render();
  });
  $('list').querySelectorAll('[data-day]').forEach(b => b.onclick = () => {
    const [y,mo,dd] = b.dataset.day.split('-').map(Number);
    state.day = new Date(y, mo-1, dd);
    render();
  });
}

function paintTimeline() {
  const box = $('dayTimeline');
  const d = state.day;
  const w = windowFor(d);
  const iso = isoOf(d);

  const dayAppts = appts
    .filter(a => a.status !== 'cancelled' && isoOf(dateOf(a)) === iso)
    .sort((x,y) => dateOf(x) - dateOf(y));

  let html = '<div class="dayhdr">' + DOW[d.getDay()] + ' ' + d.getDate() + '.' +
             (d.getMonth()+1) + '.' + d.getFullYear() + '</div>';

  // אירועים שבוטלו לשבוע זה — בראש היום, בלי שעה
  eventsFor(d).forEach((ev, i) => {
    if (ev.cancelled) html += cancelledNoteHtml(ev, iso, i);
  });

  /* משימות חידוש מרשם — בראש היום, בלי שעה ולפני ציר הזמן.
     הן אינן משתתפות בציר עצמו כי אין להן מיקום בו. */
  const rx = dayAppts.filter(isRxTask);
  if (rx.length) {
    html += '<div class="rxhdr">משימות להיום · ' + rx.length + '</div>';
    rx.forEach(a => { html += cardHtml(a); });
  }

  if (!w) {
    html += '<div class="closedday">היום סגור לקביעה עצמאית' +
            (d.getDay() === 3 ? ' — יום מכבי' : '') +
            '. אפשר להוסיף תור ידנית.</div>';
  }

  const openM  = w ? toMin(w.open)  : null;
  const closeM = w ? toMin(w.close) : null;
  const startOf = (a) => { const t = dateOf(a); return t.getHours()*60 + t.getMinutes(); };
  const blocked = blockedFor(d);
  /* ברירת המחדל לרצועה חסומה ביום שיש בו אירוע היא "חיץ" ולא שם
     האירוע — אחרת 11:40 היה נראה כשעת הפגישה, והמטרה כאן הפוכה. */
  const blockLabel = (schedule.overrides[iso] || {}).blocked_label ||
                     (eventsFor(d).some(e => !e.cancelled) ? 'חיץ' : null);

  /* תורים שנקבעו מחוץ לשעות הפעילות מוצגים בנפרד, כדי שלא ייעלמו.
     משימות מרשם אינן משתתפות — הן כבר הוצגו בראש היום, ואין להן
     שעה שתציב אותן בתוך הציר או מחוצה לו. */
  const timed   = dayAppts.filter(a => !isRxTask(a));
  const inside  = w ? timed.filter(a => startOf(a) >= openM && startOf(a) < closeM) : [];
  const outside = w ? timed.filter(a => !(startOf(a) >= openM && startOf(a) < closeM)) : timed;

  if (w) {
    /* תורים ואירועים פעילים נכנסים לאותו ציר זמן, ממוינים יחד.
       אירוע מוצג בשעות שלו; החיץ סביבו נופל לתוך ה"פנוי" ומצויר שם
       כרצועה חסומה — כך שהשעה שרואים היא שעת הפגישה האמיתית. */
    const occ = inside.map(a => ({
        at: startOf(a), to: startOf(a) + (a.slot_duration_min || 30), appt: a }));
    eventsFor(d).forEach((ev, i) => {
      if (ev.cancelled || !ev.start || !ev.end) return;
      occ.push({ at: toMin(ev.start), to: toMin(ev.end), ev, evIdx: i });
    });
    occ.sort((x, y) => x.at - y.at);

    let cursor = openM;
    const q = occ.slice();
    while (cursor < closeM) {
      const next = q[0];
      if (next && next.at <= cursor) {
        html += next.appt ? cardHtml(next.appt) : eventHtml(next.ev, iso, next.evIdx);
        cursor = Math.max(cursor + 1, next.to);
        q.shift();
        continue;
      }
      const gapEnd = next ? Math.min(next.at, closeM) : closeM;
      if (gapEnd > cursor) html += gapHtml(cursor, gapEnd, blocked, blockLabel);
      cursor = gapEnd;
    }
    if (!occ.length && !outside.length) {
      html += '<div class="empty" style="padding:20px">כל היום פנוי</div>';
    }
  }

  if (outside.length) {
    html += '<div class="dayhdr" style="margin-top:20px">מחוץ לשעות הפעילות</div>';
    outside.forEach(a => { html += cardHtml(a); });
  }

  box.innerHTML = html;
  wire(box);
  box.querySelectorAll('[data-free]').forEach(b => b.onclick = () => {
    openManual(null, { date: iso, time: b.dataset.free });
  });
  wireEvents(box);
}

/* ביטול והחזרה של אירוע — ליום אחד בלבד.
   שאר השבועות אינם מושפעים, כי לכל תאריך יש עותק משלו של האירוע. */
function wireEvents(box) {
  const setCancelled = async (dateIso, idx, val) => {
    const ov = schedule.overrides[dateIso];
    if (!ov || !Array.isArray(ov.events) || !ov.events[idx]) return;
    const events = ov.events.map((e, i) =>
      i === +idx ? Object.assign({}, e, { cancelled: val }) : e);
    await saveOverride(dateIso, { events });
    toast(val ? 'האירוע בוטל לשבוע זה — הזמן פנוי לקביעה' : 'האירוע הוחזר');
  };
  box.querySelectorAll('[data-evcancel]').forEach(b => b.onclick = () =>
    setCancelled(b.dataset.evdate, b.dataset.evcancel, true));
  box.querySelectorAll('[data-evrestore]').forEach(b => b.onclick = () =>
    setCancelled(b.dataset.evdate, b.dataset.evrestore, false));
}

/* ── זמן חסום ביומן ────────────────────────────────────────────────
   עד עכשיו יחידה חסומה פשוט לא נספרה כפנויה — ולכן לא הופיעה ביומן
   בכלל, והזמן נראה פנוי. עתליה הייתה רואה חלון ריק בלי לדעת למה
   אי אפשר לקבוע בו.

   עכשיו החסימה מוצגת במפורש, עם השם שניתן לה (blocked_label) —
   למשל "זום עם ענת" בימי שלישי. ─────────────────────────────── */
function blockedHtml(fromMin, toMinEnd, label) {
  const t = (m) => pad(Math.floor(m/60)) + ':' + pad(m%60);
  return '<div class="blockedrow">' +
      '<span class="t">' + t(fromMin) + ' – ' + t(toMinEnd) + '</span>' +
      '<span class="lbl">' + esc(label || 'זמן חסום') + '</span>' +
    '</div>';
}

/* אירוע פעיל — בשעות האמיתיות שלו, כדי שאפשר יהיה לדעת מתי להתחבר */
function eventHtml(ev, iso, idx) {
  return '<div class="evrow">' +
      '<span class="t">' + esc(ev.start) + ' – ' + esc(ev.end) + '</span>' +
      '<span class="ttl">' + esc(ev.title || 'אירוע') + '</span>' +
      '<button data-evcancel="' + idx + '" data-evdate="' + iso + '">בטל לשבוע זה</button>' +
    '</div>';
}

/* אירוע שבוטל לשבוע מסוים — בראש היום, בלי שעה.
   הזמן עצמו משוחרר לקביעה; ההערה כאן רק כדי שלא תתעורר השאלה
   "למה פתאום פנוי ב-12:00". */
function cancelledNoteHtml(ev, iso, idx) {
  return '<div class="evcancelled">' +
      '<span class="x">✕</span>' +
      '<span class="ttl">' + esc(ev.title || 'אירוע') + ' — בוטל לשבוע זה</span>' +
      '<button data-evrestore="' + idx + '" data-evdate="' + iso + '">החזר</button>' +
    '</div>';
}

/* מפצל חלון פנוי לקטעים פנויים וקטעים חסומים, לפי רשת היחידות */
function gapHtml(fromMin, toMinEnd, blocked, label) {
  if (toMinEnd <= fromMin) return '';
  if (!blocked || !blocked.size) return freeHtml(fromMin, toMinEnd);

  const step = CFG.baseGridMin;
  let out = '', segStart = fromMin, segBlocked = null;
  for (let m = fromMin; m < toMinEnd; m += step) {
    const b = blocked.has(pad(Math.floor(m/60)) + pad(m%60));
    if (segBlocked === null) { segBlocked = b; segStart = m; }
    else if (b !== segBlocked) {
      out += segBlocked ? blockedHtml(segStart, m, label) : freeHtml(segStart, m);
      segStart = m; segBlocked = b;
    }
  }
  out += segBlocked ? blockedHtml(segStart, toMinEnd, label)
                    : freeHtml(segStart, toMinEnd);
  return out;
}

function freeHtml(fromMin, toMinEnd) {
  const len = toMinEnd - fromMin;
  const t = (m) => pad(Math.floor(m/60)) + ':' + pad(m%60);
  return '<div class="free">' +
      '<span class="t">' + t(fromMin) + ' – ' + t(toMinEnd) + '</span>' +
      '<span class="lbl">פנוי · ' + len + ' דק׳</span>' +
      '<button data-free="' + t(fromMin) + '">+ קבע כאן</button>' +
    '</div>';
}

                'יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

function cardHtml(a) {
  if (isRxTask(a)) return rxCardHtml(a);
  const st = statusOf(a), f = a.flags || {}, d = dateOf(a);
  const manual = a.source === 'manual';
  const svcName = CFG.serviceNames[a.service_code] || '—';

  const badges = [];
  if (manual) badges.push('<span class="badge manual">תור ידני</span>');
  if (a.off_hours) badges.push('<span class="badge late">מחוץ לשעות הקבלה</span>');
  if (a.last_visit) badges.push('<span class="badge ret">🔄 ביקור אחרון: '+esc(a.last_visit)+'</span>');
  if (st === 'red') badges.push('<span class="badge late">מעל שעתיים ללא תגובה</span>');
  if (a.lead_source && a.lead_source !== 'staff')
    badges.push('<span class="badge">מקור: '+esc({google_ads:'גוגל אדס',organic:'אורגני',
      whatsapp:'ווטסאפ',direct:'ישיר',referral:'הפניה',other_campaign:'קמפיין'}[a.lead_source]||a.lead_source)+'</span>');

  /* ── ציר הזמן של התור ──────────────────────────────────────────
     השורה הראשונה היא תמיד מתי התור נקבע. היא לא צ'קבוקס ואין לה
     "ביטול סימון" — אף אחד לא סימן אותה, היא פשוט קרתה.
     יחד עם שתי השורות שאחריה מתקבל תיעוד מלא: מתי נקבע, מתי
     נשלחה בקשת המקדמה, ומתי שולמה והתור הועתק. ──────────────── */
  const booked = a.created_at
    ? doneRow(manual ? TXT.bookedManual : TXT.booked, a.created_at)
    : '';

  let checks = '';
  /* לחיצה על "הודעה ראשונה" מסמנת גם את הצ'קבוקס.
     בלי זה, מי ששולח ושוכח לסמן מקבל תור שנשאר כתום לנצח —
     והטיימר של השעתיים, שנספר מרגע הסימון, לא מתחיל בכלל. */
  const wa = (kind, label, cls) =>
    '<a class="wabtn'+(cls?' '+cls:'')+'" href="'+waLink(a, kind)+'"' +
    (kind === 'first' ? ' data-mark="'+a._id+'"' : '') +
    ' target="_blank" rel="noopener">' + esc(label) + '</a>';

  if (a.status === 'cancelled') {
    if (a.cancel_reason)
      badges.push('<span class="badge">סיבת ביטול: '+esc(a.cancel_reason)+'</span>');
    // הנוסח נבחר לפי סיבת הביטול — ראו cancelWaKind
    checks = (booked ? '<div class="checks">' + booked +
        (a.status_changed_at ? doneRow('התור בוטל', a.status_changed_at) : '') +
      '</div>' : '') +
      '<div class="acts">' +
      wa(cancelWaKind(a),'💬 שלח הודעת ביטול','go') +
      '<button data-act="revive" data-id="'+a._id+'">החזרה ליומן</button></div>';
  } else if (manual) {
    checks = '<div class="checks">' + booked +
        chk(a._id,'copied_at',TXT.cbManual,f.copied_at) + '</div>' +
      '<div class="acts">' +
        '<button class="primary" data-act="odoro" data-id="'+a._id+'">📋 העתקה לאודורו</button>' +
        '<button data-act="follow" data-id="'+a._id+'">קבע תור המשך</button>' +
        '<button data-act="cancel" data-id="'+a._id+'">ביטול</button></div>';
  } else {
    checks = '<div class="checks">' + booked +
        chk(a._id,'contacted_at',TXT.cb1,f.contacted_at) +
        chk(a._id,'paid_entered_at',TXT.cb2,f.paid_entered_at) +
      '</div><div class="acts">' +
        (f.contacted_at ? wa('reminder','💬 תזכורת', st==='red'?'go':'')
                        : wa('first','💬 הודעה ראשונה','go')) +
        '<button class="primary" data-act="odoro" data-id="'+a._id+'">📋 העתקה לאודורו</button>' +
        '<button data-act="follow" data-id="'+a._id+'">קבע תור המשך</button>' +
        '<button data-act="cancel" data-id="'+a._id+'">'+esc(TXT.cb3)+'</button></div>';
  }

  const n = splitName(a);
  const val = (label, v) => v
    ? '<span class="v" data-copy="'+esc(v)+'" title="לחיצה מעתיקה">'+esc(v)+'</span>'
    : '<span class="v none">—</span>';

  const fields =
    '<div class="fields">' +
      '<div class="row">' +
        '<span class="f"><span class="k">שם פרטי:</span>'  + val('שם פרטי',  n.first) + '</span>' +
        '<span class="f"><span class="k">שם משפחה:</span>' + val('שם משפחה', n.last)  + '</span>' +
      '</div>' +
      '<div class="row"><span class="f"><span class="k">מספר זהות:</span>' +
        val('מספר זהות', a.patient_id_number) + '</span></div>' +
      '<div class="row"><span class="f"><span class="k">נייד:</span>' +
        val('נייד', a.patient_phone) +
        '<a class="tel" style="margin-inline-start:10px;font-size:14px" href="tel:'+esc(a.patient_phone)+'">חיוג</a>' +
        '<a class="tel" style="margin-inline-start:8px;font-size:14px" href="https://wa.me/972'+
          esc(String(a.patient_phone||'').replace(/^0/,''))+'" target="_blank" rel="noopener">ווטסאפ</a>' +
      '</span></div>' +
    '</div>';

  const copyBar = a.status === 'cancelled' ? '' :
    '<div class="copybar" data-bar="'+a._id+'">' +
      '<div class="step"></div>' +
      '<div class="next"></div>' +
      '<div class="track"></div>' +
    '</div>';

  return '<div class="card '+st+'" data-card="'+a._id+'">' +
    '<div class="hd"><span class="when">'+hhmmOf(d)+' · '+a.slot_duration_min+' דק׳</span>' +
      '<span class="name">'+esc(svcName)+'</span></div>' +
    fields +
    (a.patient_note ? '<div class="note">הערת המטופל: '+esc(a.patient_note)+'</div>' : '') +
    (badges.length ? '<div class="badges">'+badges.join('')+'</div>' : '') +
    copyBar +
    checks + '</div>';
}

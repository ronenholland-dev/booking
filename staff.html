/* שם פרטי ומשפחה.
   הטופס מבקש אותם בשני שדות נפרדים, ולכן הם מגיעים מוכנים.
   הניחוש לפי רווח נשאר רק כגיבוי לרשומות שנוצרו לפני השינוי —
   אחרת התור הראשון שנקבע ב-QA היה מאבד את השם. */
function splitName(a) {
  if (a && typeof a === 'object') {
    if (a.patient_first || a.patient_last) {
      return { first: a.patient_first || '', last: a.patient_last || '' };
    }
    a = a.patient_name;
  }
  const p = String(a || '').trim().split(/\s+/).filter(Boolean);
  return { first: p[0] || '', last: p.slice(1).join(' ') };
}

/* ══════════════════════════════════════════════════════════════════
   6ב. העתקה לאודורו
   כל שדה מועתק בנפרד, בסדר קבוע, כדי שאפשר יהיה להדביק אותו
   בשדה המתאים באודורו ב-Ctrl+V בלי לערוך כלום ובלי טעויות הקלדה.
   ══════════════════════════════════════════════════════════════════ */
async function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(t); return true;
    }
  } catch (e) {}
  // גיבוי לדפדפנים/הקשרים שבהם ה-API החדש חסום (למשל פתיחה מקובץ מקומי)
  try {
    const ta = document.createElement('textarea');
    ta.value = t;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function odoroFields(a) {
  const n = splitName(a);
  return [
    { k: 'שם פרטי',   v: n.first },
    { k: 'שם משפחה',  v: n.last },
    { k: 'מספר זהות', v: a.patient_id_number },
    { k: 'נייד',      v: a.patient_phone }
  ].filter(f => f.v);          // מדלג על שדות ריקים, למשל מטופל בלי ת"ז
}

/* ── בניית קישור וואטסאפ עם הודעה מוכנה ──────────────────────────
   שום הודעה לא נשלחת מכאן. הקישור רק פותח את השיחה עם הטקסט מוכן,
   והשליחה נשארת פעולה אנושית — בדיוק כפי שהוגדר באיפיון. */
function waLink(a, kind) {
  const tpl = WA[kind] || '';
  const d   = dateOf(a);
  const n   = splitName(a);
  const pay = CFG.paymentLink ? CFG.paymentLink + '\n\n' : '';
  const who = CFG.clinicVoice;   // אחיד לכל מי שמחובר — ראו ההסבר ב-CFG

  const text = tpl
    .replace(/\{שם\}/g,    n.first || '')
    .replace(/\{תאריך\}/g, 'יום ' + DOW[d.getDay()] + ' ' + d.getDate() + '.' + (d.getMonth()+1))
    .replace(/\{שעה\}/g,   hhmmOf(d))
    .replace(/\{נושא\}/g,  CFG.serviceNames[a.service_code] || '')
    .replace(/\{תשלום\}/g, pay)
    .replace(/\{שולח\}/g,  who)
    .replace(/\n{3,}/g, '\n\n');   // מנקה שורות ריקות מיותרות אם קישור התשלום חסר

  const phone = '972' + String(a.patient_phone || '').replace(/\D/g,'').replace(/^0/,'');
  return 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);
}

const copyStep = {};   // מזהה תור → באיזה שדה אנחנו עומדים

function paintCopyBar(id) {
  const a = appts.find(x => x._id === id);
  const bar = document.querySelector('[data-bar="'+id+'"]');
  if (!a || !bar) return;
  const list = odoroFields(a);
  const i = copyStep[id] || 0;
  bar.classList.add('on');

  if (i >= list.length) {
    bar.querySelector('.step').textContent = '';
    bar.querySelector('.next').innerHTML =
      '<span class="done">✓ כל השדות הועתקו</span>' +
      '<button class="ghost" data-copyact="restart" data-id="'+id+'">התחל מחדש</button>' +
      '<button class="ghost" data-copyact="close" data-id="'+id+'">סגור</button>';
  } else {
    const f = list[i];
    bar.querySelector('.step').textContent =
      'שדה ' + (i+1) + ' מתוך ' + list.length + ' — העתיקו, הדביקו באודורו, והמשיכו';
    bar.querySelector('.next').innerHTML =
      '<span class="k" style="color:var(--muted);font-size:14px">' + esc(f.k) + ':</span>' +
      '<span class="nextval">' + esc(f.v) + '</span>' +
      '<button data-copyact="copy" data-id="'+id+'">העתק והמשך</button>' +
      '<button class="ghost" data-copyact="close" data-id="'+id+'">סגור</button>';
  }
  bar.querySelector('.track').innerHTML =
    list.map((f,k) => '<i class="'+(k<i?'ok':(k===i?'cur':''))+'"></i>').join('');

  /* הכפתורים כאן נוצרים מחדש בכל ציור של הסרגל, ולכן חייבים לחבר להם
     מאזין כאן ולא ב-wire() — שרץ פעם אחת לפני שהסרגל בכלל קיים. */
  bar.querySelectorAll('[data-copyact]').forEach(b => {
    b.onclick = () => copyAct(b.dataset.copyact, b.dataset.id);
  });
}

async function copyAct(act, id) {
  const a = appts.find(x => x._id === id);
  if (!a) return;
  const list = odoroFields(a);
  if (act === 'close')   { copyStep[id] = 0; const b = document.querySelector('[data-bar="'+id+'"]'); if (b) b.classList.remove('on'); return; }
  if (act === 'restart') { copyStep[id] = 0; paintCopyBar(id); return; }
  if (act === 'open')    { copyStep[id] = 0; paintCopyBar(id); return; }
  if (act === 'copy') {
    const i = copyStep[id] || 0;
    const f = list[i];
    if (!f) return;
    const ok = await copyText(f.v);
    toast(ok ? ('הועתק — ' + f.k + ': ' + f.v) : 'ההעתקה נכשלה');
    copyStep[id] = i + 1;
    paintCopyBar(id);
  }
}

/* ── צ'קבוקס שהופך לתיעוד ──────────────────────────────────────────
   כל עוד האירוע לא קרה — תיבת סימון. ברגע שסומן, האירוע התחולל
   בעולם האמיתי: הודעה נשלחה, כסף שולם, תור הועתק לאודורו. אי אפשר
   "לבטל" אותו בלחיצה, ולכן התיבה נעלמת ובמקומה נשאר תיעוד עם שעה.

   למה בכל זאת יש "ביטול סימון":
     סימון בטעות הוא תרחיש אמיתי, והנזק שלו גדול מהנזק של ביטול
     בטעות — תור שמסומן "שולם" בלי ששולם ייכנס לאודורו וייתפס
     כסגור. לכן יש דרך חזרה, אבל היא קטנה, לא מזמינה, ודורשת אישור.
   ──────────────────────────────────────────────────────────────── */
/* ══════════════════════════════════════════════════════════════════
   6ג. המרות אופליין לגוגל אדס

   מה הבעיה שזה פותר:
     גוגל יודעת מי לחץ על המודעה וקבע תור. היא לא יודעת מי מהם
     באמת שילם והגיע — וזה בדיוק ההבדל בין קמפיין טוב לקמפיין
     שנראה טוב. בלי הנתון הזה, האלגוריתם מייעל למי שלוחץ "קבע תור",
     ולא למי שהופך למטופל.

   מה נשלח:
     gclid — מזהה קליק אנונימי שגוגל עצמה יצרה. אין בו שום פרט על
     המטופל, ולכן אין כאן דליפה של מידע רפואי. זו הסיבה שנבחרה
     השיטה הזו ולא Enhanced Conversions, ששולחת טלפון ומייל מגובבים.

   ⚠️ הקובץ הזה מכיל אך ורק gclid, מועד וערך. אין בו שם, טלפון,
      ת"ז או סוג טיפול — גם לא בעקיפין דרך הערך: יש שתי רמות ערך
      בלבד, חדש וביקורת, ולא ערך לכל תחום.
   ══════════════════════════════════════════════════════════════════ */
const ADS = {
  /* שם פעולת ההמרה בגוגל אדס — חייב להיות זהה בדיוק לשם שהוגדר שם */
  conversionName: 'Paid Appointment',
  /* אותם ערכים כמו באפליקציה. ביקור חדש שווה יותר מביקורת. */
  value: { new: 2000, follow: 600 },
  currency: 'ILS',
  /* כל כמה ימים להזכיר */
  remindEveryDays: 7,
  /* מי רואה את התזכורת. עתליה לא מעלה המרות לגוגל אדס, ואין סיבה
     להציג לה משימה שאינה שלה. */
  owner: 'ronenholland@gmail.com'
};

const ADS_LAST_KEY   = 'holland_ads_last_v1';    // מתי הועלה בפועל
const ADS_SNOOZE_KEY = 'holland_ads_snooze_v1';  // עד מתי נדחתה התזכורת
const lsGet = (k) => { try { return +(localStorage.getItem(k) || 0); } catch (e) { return 0; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, String(v)); } catch (e) {} };

/* גוגל אדס דורשת חותמת עם היסט אזור זמן מפורש. בלי ההיסט היא
   מפרשת את השעה כשעון החשבון, וההמרה עלולה ליפול לפני הקליק
   ואז להידחות בשקט. */
function adsTime(d) {
  const off = -d.getTimezoneOffset();
  const sign = off >= 0 ? '+' : '-';
  const oh = pad(Math.floor(Math.abs(off)/60)), om = pad(Math.abs(off)%60);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+
         pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+
         ' '+sign+oh+om;
}

/* תורים שמוכנים להעלאה: הגיעו מקליק בגוגל, שולמו והוזנו לאודורו,
   ועדיין לא הועלו. תור ידני או אורגני לא ייכנס — אין לו gclid. */
function adsPending(list) {
  return (list || appts).filter(a =>
       a.gclid
    && !a.offline_uploaded
    && a.status !== 'cancelled'
    && a.flags && a.flags.paid_entered_at
  );
}

/* עמודות הגיליון שגוגל אדס מושכת ממנו, בסדר קבוע.
   כל שינוי כאן מחייב שינוי מקביל בגיליון ובמיפוי השדות בגוגל אדס. */
const ADS_COLUMNS = [
  'Google_Click_ID', 'GBRAID', 'WBRAID', 'Transaction_ID',
  'Conversion_Name', 'Conversion_Time', 'Conversion_Value', 'Conversion_Currency'
];

function adsCsv(rows, withHeader) {
  const esc2 = (v) => {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const lines = withHeader === false ? [] : [ADS_COLUMNS.join(',')];

  rows.forEach(a => {
    /* ── שלוש עמודות, ערך אחד ────────────────────────────────────
       gclid, gbraid ו-wbraid הם שלושה סוגי מזהה קליק, ולגוגל יש
       עמודה נפרדת לכל אחד. הערך נכתב לעמודה שלו והשאר נשארות
       ריקות. gbraid שנשלח בעמודת Google Click ID נדחה בשקט,
       וזה בדיוק מה שהיה קורה לכל המרה ממשתמש אייפון.

       תור ישן שנשמר לפני שהשדה הזה נוסף — נחשב gclid, כי זה
       היה המזהה היחיד שהאפליקציה קלטה באותה תקופה. */
    const t = a.click_id_type || 'gclid';
    const val = ADS.value[a.visit_track] != null
              ? ADS.value[a.visit_track] : ADS.value.new;

    lines.push([
      esc2(t === 'gclid'  ? a.gclid : ''),
      esc2(t === 'gbraid' ? a.gclid : ''),
      esc2(t === 'wbraid' ? a.gclid : ''),
      // מזהה התור — מונע ספירה כפולה אם שורה נכנסת לגיליון פעמיים
      esc2(a.id || a._id),
      esc2(ADS.conversionName),
      esc2(adsTime(stampOf(a.flags.paid_entered_at))),
      esc2(val),
      esc2(ADS.currency)
    ].join(','));
  });
  return lines.join('\n');
}

async function adsExport() {
  const rows = adsPending();
  if (!rows.length) { toast('אין המרות חדשות להעלאה'); return; }

  const iso = isoOf(new Date());
  download('holland-conversions-' + iso + '.csv', adsCsv(rows));

  /* הסימון נעשה רק אחרי אישור מפורש, ולא אוטומטית עם ההורדה.
     אם ההוספה לגיליון תיכשל והתורים כבר סומנו — הם לא יופיעו שוב
     לעולם, וההמרות פשוט יאבדו בלי שאף אחד ידע. */
  if (!confirm('הקובץ ירד — ' + rows.length + ' המרות.\n\n' +
               'הוסיפו את השורות בסוף הגיליון "Holland — Google Ads Conversions",\n' +
               'ורק אחרי שהן שם לחצו אישור.\n\n' +
               'גוגל מושכת מהגיליון פעם ביום. אין צורך להעלות דבר לגוגל אדס.')) {
    toast('הקובץ ירד. ההמרות לא סומנו — יופיעו שוב בפעם הבאה.');
    return;
  }
  try {
    for (const a of rows) {
      await setDoc(doc(db,'appointments',a._id),
                   { offline_uploaded: true, offline_uploaded_at: Timestamp.now() },
                   { merge: true });
    }
    lsSet(ADS_LAST_KEY, Date.now());
    lsSet(ADS_SNOOZE_KEY, 0);
    toast(rows.length + ' המרות סומנו כמועלות');
    render();
  } catch (e) { console.error(e); toast('סימון ההמרות נכשל'); }
}

function download(name, text) {
  const blob = new Blob(['﻿' + text], { type:'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* התזכורת. שלושה תנאים, וכולם חייבים להתקיים:
     1. המשתמש המחובר הוא רוני — לא עתליה
     2. יש בפועל המרות שממתינות
     3. עברו מספיק ימים מאז הפעם האחרונה, או שנצבר מספיק
   התנאי השני הוא העיקר: תזכורת שמופיעה כשאין מה לעשות איתה
   הופכת תוך שבועיים לרעש שמדלגים עליו. */
function paintAdsBanner() {
  const bar = $('adsBanner');
  if (!bar) return;
  const me = auth.currentUser ? (auth.currentUser.email || '') : '';
  const rows = adsPending();

  const last  = lsGet(ADS_LAST_KEY);
  const until = lsGet(ADS_SNOOZE_KEY);
  const days  = (Date.now() - last) / 86400000;

  /* צבירה של 10 המרות גוברת על הדחייה ועל מניין הימים. אם הצטבר
     כל כך הרבה, השבוע כבר לא רלוונטי — יש כאן נתונים שגוגל
     לא רואה, וכל יום נוסף הוא יום של תקציב שמתבזבז. */
  const show = me.toLowerCase() === ADS.owner.toLowerCase()
            && rows.length > 0
            && (rows.length >= 10 ||
                (Date.now() > until && (!last || days >= ADS.remindEveryDays)));

  bar.classList.toggle('hidden', !show);
  if (!show) return;

  $('adsTitle').textContent =
    rows.length + ' המרות ממתינות להוספה לגיליון';
  $('adsSub').textContent = last
    ? 'ההעלאה האחרונה: לפני ' + Math.floor(days) + ' ימים'
    : 'טרם בוצעה העלאה';
}

function chk(id, field, label, val) {
  if (val) return doneRow(label, val, id, field);
  return '<label class="chk"><input type="checkbox" data-id="'+id+'" data-f="'+field+'">' +
    '<span>'+esc(label)+'</span></label>';
}

/* שורת אירוע שהתרחש. בלי field — אין כפתור ביטול, כי יש אירועים
   שלא הצוות סימן ואי אפשר "לבטל" אותם: קביעת התור עצמה. */
function doneRow(label, val, id, field) {
  return '<div class="done">' +
      '<span class="tick">✓</span>' +
      '<span class="txt">'+esc(label) +
        '<span class="stamp">'+esc(fmtStamp(val))+'</span></span>' +
      (field ? '<button class="undo" data-undo="'+field+'" data-id="'+id+'" ' +
               'title="לביטול סימון שנעשה בטעות">ביטול סימון</button>' : '') +
    '</div>';
}

function wire(host) {
  host.querySelectorAll('.chk input').forEach(el => {
    el.onchange = () => setFlag(el.dataset.id, el.dataset.f, el.checked);
  });
  /* ביטול סימון — רק אחרי אישור מפורש. לחיצה בודדת לא מספיקה
     כדי לבטל אירוע שכבר קרה, וזו בדיוק התקלה שהתיקון הזה נועד למנוע. */
  host.querySelectorAll('[data-undo]').forEach(b => {
    b.onclick = () => {
      if (!confirm(TXT.undoWarn)) return;
      setFlag(b.dataset.id, b.dataset.undo, false);
      toast(TXT.undone);
    };
  });
  host.querySelectorAll('[data-act]').forEach(b => {
    const a = appts.find(x => x._id === b.dataset.id);
    if (!a) return;
    b.onclick = () => ({ cancel:cancelAppt, revive:reviveAppt, follow:openManual,
                         odoro:(x)=>copyAct('open', x._id) }[b.dataset.act])(a);
  });
  // לחיצה על ערך בודד מעתיקה רק אותו
  host.querySelectorAll('.v[data-copy]').forEach(el => {
    el.onclick = async () => {
      const ok = await copyText(el.dataset.copy);
      if (ok) { el.classList.add('copied'); setTimeout(()=>el.classList.remove('copied'), 900); }
      toast(ok ? 'הועתק: ' + el.dataset.copy : 'ההעתקה נכשלה');
    };
  });
  host.querySelectorAll('[data-copyact]').forEach(b => {
    b.onclick = () => copyAct(b.dataset.copyact, b.dataset.id);
  });
  host.querySelectorAll('[data-mark]').forEach(el => {
    el.addEventListener('click', () => {
      const a = appts.find(x => x._id === el.dataset.mark);
      if (a && !(a.flags && a.flags.contacted_at)) {
        setFlag(el.dataset.mark, 'contacted_at', true);
        toast('סומן שנשלחה הודעה ראשונה — לביטול, "ביטול סימון" בכרטיס');
      }
    });
  });
  // שמירת מצב סרגל ההעתקה בין רינדורים (למשל כשמגיע עדכון realtime)
  Object.keys(copyStep).forEach(id => {
    if (copyStep[id] > 0 && host.querySelector('[data-bar="'+id+'"]')) paintCopyBar(id);
  });
}

/* ══════════════════════════════════════════════════════════════════
   7. תור ידני / תור המשך
   כשמגיעים מכרטיס קיים — פרטי המטופל מועתקים אוטומטית, בלי הקלדה.
   ══════════════════════════════════════════════════════════════════ */
function openManual(from, preset) {
  const pick = { date: (preset && preset.date) || isoOf(state.day),
                 time: (preset && preset.time) || null,
                 duration: 20 };
  const host = $('modalHost');

  host.innerHTML =
  '<div class="modal"><div class="sheet">' +
    '<h2>'+(from ? 'תור המשך' : 'הוספת תור ידנית')+'</h2>' +
    '<div class="sub">'+(from ? 'הפרטים הועתקו מ'+esc(from.patient_name)
                              : 'התור ייפתח במצב מטופל — הצוות כבר סגר את הפרטים')+'</div>' +
    '<div class="row">' +
      '<div><label>שם פרטי</label><input id="mFirst" value="'+esc(from?splitName(from).first:'')+'">' +
        '<div class="err" id="eFirst">נא למלא שם פרטי</div></div>' +
      '<div><label>שם משפחה</label><input id="mLast" value="'+esc(from?splitName(from).last:'')+'">' +
        '<div class="err" id="eLast">נא למלא שם משפחה</div></div>' +
    '</div>' +
    '<label>מספר נייד</label><input id="mPhone" inputmode="numeric" value="'+esc(from?from.patient_phone:'')+'">' +
    '<div class="err" id="ePhone">מספר נייד לא תקין</div>' +
    '<label>מספר זהות (לא חובה)</label><input id="mId" inputmode="numeric" value="'+esc(from&&from.patient_id_number?from.patient_id_number:'')+'">' +
    '<label class="chk rxchk"><input type="checkbox" id="mRx">' +
      '<span>חידוש מרשם בלבד — משימה ללא שעה</span></label>' +
    '<div id="mRxInfo" class="rxinfo" style="display:none"></div>' +
    '<div id="mRxNoteWrap" style="display:none">' +
      '<label>הערה לרופא (תרופה, תשלום, כל דבר אחר)</label>' +
      '<textarea id="mRxNote" placeholder="למשל: סיאליס 5 מ״ג, שילם בביט"></textarea>' +
    '</div>' +
    '<div id="mTimed">' +
    '<label>סוג הביקור</label><select id="mDur">' +
      Object.entries(CFG.durations).map(([m,n]) =>
        '<option value="'+m+'"'+(String(m)===String(pick.duration)?' selected':'')+'>'+esc(n)+' · '+m+' דק׳</option>').join('') +
    '</select>' +
    '<label>תאריך</label><input id="mDate" type="date" value="'+pick.date+'">' +
    '<div id="mWin" class="sub" style="margin:6px 0 2px"></div>' +
    '<label>שעה פנויה</label><div class="slotpick" id="mSlots"></div>' +
    '<label class="chk" style="margin-top:8px"><input type="checkbox" id="mForce">' +
      '<span>לחרוג משעות הקבלה של אותו יום</span></label>' +
    '<div class="err" id="eSlot">נא לבחור שעה</div>' +
    '<label>הערה (לא חובה)</label><textarea id="mNote"></textarea>' +
    '</div>' +
    '<button class="go" id="mSave">שמור תור</button>' +
    '<button class="cancel" id="mCancel">ביטול</button>' +
  '</div></div>';

  const close = () => { host.innerHTML = ''; };
  $('mCancel').onclick = close;
  host.querySelector('.modal').onclick = (e) => { if (e.target.classList.contains('modal')) close(); };

  /* keepTime שומר על השעה שנבחרה מהיומן ב-"+ קבע כאן". בלעדיו
     הציור הראשון מחק אותה, והצוות היה צריך לחפש שוב את אותה שעה. */
  const paintSlots = (keepTime) => {
    pick.duration = +$('mDur').value;
    pick.date = $('mDate').value;
    if (!keepTime) pick.time = null;
    const box = $('mSlots');
    const [y,mo,dd] = pick.date.split('-').map(Number);
    const day = new Date(y, mo-1, dd);
    const w = windowFor(day);
    const force = $('mForce') && $('mForce').checked;

    /* ── למה זה חשוב ────────────────────────────────────────────────
       קודם, יום סגור נפל אוטומטית ל-08:00–20:00, וכך "תור המשך"
       הציע שעות בימים שהמרפאה כלל לא פתוחה בהם. תור שנקבע ככה
       נראה תקין לגמרי במסך — ומתגלה רק כשהמטופל מגיע לדלת נעולה.
       עכשיו הלוז הוא הכלל, והחריגה היא החלטה מודעת בצ׳קבוקס.
       ─────────────────────────────────────────────────────────── */
    const dow = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'][day.getDay()];
    const win = $('mWin');
    if (win) {
      win.textContent = w
        ? ('יום ' + dow + ' · שעות קבלה ' + w.open + '–' + w.close + (force ? ' · חורג' : ''))
        : ('יום ' + dow + ' — המרפאה סגורה' + (force ? ' · חורג' : ''));
      win.style.color = (!w || force) ? 'var(--red, #b23b3b)' : 'var(--muted)';
    }

    if (!w && !force) {
      box.innerHTML = '<div style="grid-column:1/-1;color:var(--muted);font-size:15px">' +
        'יום ' + dow + ' סגור בלוז. כדי לקבוע בכל זאת — סמנו "לחרוג משעות הקבלה".</div>';
      pick.time = null;
      return;
    }

    // תפוסה נגזרת מהתורים שכבר טעונים למסך — מספיק להצגה,
    // והנעילה עצמה נבדקת שוב בטרנזקציה בעת השמירה.
    const busy = new Set();
    appts.filter(a => a.status !== 'cancelled' && isoOf(dateOf(a)) === pick.date)
         .forEach(a => unitsOf(a).forEach(u => busy.add(u)));
    // חסימות ידניות ממסך ההגדרות. חריגה מודעת גוברת גם עליהן —
    // אחרת אי אפשר לדחוף מטופל לחלון שנחסם להפסקה.
    if (!force) blockedFor(day).forEach(u => busy.add(u));

    const openM  = force ? toMin('08:00') : toMin(w.open);
    const closeM = force ? toMin('20:00') : toMin(w.close);
    let html = '';
    for (let m = openM; m + pick.duration <= closeM; ) {
      let fits = true;
      for (let k = 0; k < pick.duration/CFG.baseGridMin; k++) {
        const u = m + k*CFG.baseGridMin;
        if (busy.has(pad(Math.floor(u/60))+pad(u%60))) { fits = false; break; }
      }
      if (fits) { html += '<button data-t="'+pad(Math.floor(m/60))+':'+pad(m%60)+'">'+
                          pad(Math.floor(m/60))+':'+pad(m%60)+'</button>'; m += pick.duration; }
      else m += CFG.baseGridMin;
    }
    box.innerHTML = html || '<div style="grid-column:1/-1;color:var(--muted);font-size:15px">אין שעות פנויות ביום זה</div>';
    box.querySelectorAll('[data-t]').forEach(b => {
      if (pick.time && b.dataset.t === pick.time) b.classList.add('on');
      b.onclick = () => {
        pick.time = b.dataset.t;
        box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      };
    });
    // אם השעה שנבחרה מהיומן כבר לא זמינה במשך שנבחר — מנקים אותה
    if (pick.time && !box.querySelector('[data-t="'+pick.time+'"]')) pick.time = null;
  };
  /* מצב "חידוש מרשם בלבד" — אין תאריך לבחור ואין שעה. המשימה
     נכנסת ליום העבודה הפתוח הבא, ובמקום בורר השעות מוצג לאן. */
  let rxDay = null;
  const paintRx = () => {
    const on = $('mRx').checked;
    $('mTimed').style.display      = on ? 'none' : '';
    $('mRxNoteWrap').style.display = on ? '' : 'none';
    $('mRxInfo').style.display     = on ? '' : 'none';
    if (on) {
      rxDay = nextWorkingDay(new Date());
      $('mRxInfo').textContent =
        'המשימה תופיע בלוז של יום ' + DOW[rxDay.getDay()] + ' ' +
        rxDay.getDate() + '.' + (rxDay.getMonth()+1) +
        ' — בראש היום, ללא שעה. לא תיגזר לאודורו.';
    }
  };
  $('mRx').onchange = paintRx;
  paintRx();

  $('mDur').onchange   = () => paintSlots();
  $('mDate').onchange  = () => paintSlots();
  $('mForce').onchange = () => paintSlots();
  paintSlots(true);
  window.__manualRepaint = paintSlots;   // לבדיקות

  $('mSave').onclick = async () => {
    const first = $('mFirst').value.trim();
    const last  = $('mLast').value.trim();
    const phone = $('mPhone').value.replace(/\D/g,'');
    const idnum = $('mId').value.replace(/\D/g,'');
    const isRx = $('mRx').checked;
    let bad = false;
    const mark = (id,on) => { $(id).classList.toggle('on',on); if(on) bad = true; };
    mark('eFirst', first.length < 2);
    mark('eLast',  last.length  < 2);
    mark('ePhone', !/^05\d{8}$/.test(phone));
    mark('eSlot',  !isRx && !pick.time);   // למשימת מרשם אין שעה לבחור
    if (bad) return;

    if (isRx) {
      const btn = $('mSave'); btn.disabled = true; btn.textContent = 'שומר…';
      const res = await createRxTask({
        first, last, phone, idnum: idnum ? idnum.padStart(9,'0') : '',
        note: $('mRxNote').value.trim(), when: rxDay || nextWorkingDay(new Date())
      });
      btn.disabled = false; btn.textContent = 'שמור תור';
      if (res.ok) { close(); toast('המשימה נוספה ללוז'); }
      else toast('השמירה נכשלה');
      return;
    }

    const [y,mo,dd] = pick.date.split('-').map(Number);
    const [h,mi]    = pick.time.split(':').map(Number);
    const when = new Date(y, mo-1, dd, h, mi, 0, 0);

    const btn = $('mSave'); btn.disabled = true; btn.textContent = 'שומר…';
    const res = await createManual({
      first, last, phone, idnum: idnum ? idnum.padStart(9,'0') : '',
      note: $('mNote').value.trim(), duration: pick.duration, when,
      offHours: $('mForce').checked,
      serviceCode: pick.duration === 30 ? 'D' : (pick.duration === 20 ? 'R' : 'P')
    });
    btn.disabled = false; btn.textContent = 'שמור תור';

    if (res.ok) { close(); toast(TXT.saved); }
    else { toast(res.taken ? TXT.noSlot : 'השמירה נכשלה'); paintSlots(); }
  };
}
